[package]
name = "quantis-qrng"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial pure-Rust driver for ID Quantique Quantis quantum random number generators (QRNG)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gnapoli23/quantis-qrng"
documentation = "https://docs.rs/quantis-qrng"
readme = "README.md"
keywords = ["qrng", "random", "quantum", "usb", "driver"]
categories = ["hardware-support", "cryptography"]
authors = ["Giovanni Napoli"]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE"]

[[bin]]
name = "qrng"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
# the docs are the same on every target
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
thiserror = "2"
nusb = "0.2"
clap = { version = "4", features = ["derive"], optional = true }
const-hex = { version = "1.19", optional = true }
rand_core = { version = "0.10", optional = true }

[dev-dependencies]
bip39 = "3"
rand = { version = "0.10", default-features = false, features = ["std_rng", "sys_rng"] }

[features]
default = []
cli = ["dep:clap", "dep:const-hex", "rand_core"]
rand_core = ["dep:rand_core"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# no unreachable `pub` items, Debug on every public type
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
