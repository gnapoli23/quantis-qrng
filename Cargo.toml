[package]
name = "quantis-qrng"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Unofficial pure-Rust driver for ID Quantique Quantis quantum random number generators (QRNG)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gnapoli23/quantis-qrng"
readme = "README.md"
keywords = ["qrng", "random", "quantum", "usb", "driver"]
categories = ["hardware-support", "cryptography"]
authors = ["Giovanni Napoli"]
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE"]

[[bin]]
name = "qrng"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
thiserror = "2"
nusb = "0.2"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
cli = ["dep:clap"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
