name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # toolchain from rust-toolchain.toml, same as local
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install # version and components from rust-toolchain.toml
      - run: cargo build --all-targets # library alone, without the CLI
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features

  msrv:
    name: Test (MSRV 1.85)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85" # keep in sync with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal --component clippy
      - run: cargo build --all-targets
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo doc --no-deps --all-features

  # latest stable, only to see the new lints before updating rust-toolchain.toml.
  # it can fail without failing the CI
  latest:
    name: Clippy (latest stable, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --all-targets --all-features
