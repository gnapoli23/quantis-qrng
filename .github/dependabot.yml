# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# `chore(deps)` commits are not in the changelog (see cliff.toml)
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # one PR for all the compatible updates, a major one gets its own PR
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  # rust-toolchain.toml
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
