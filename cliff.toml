# git-cliff config, generates CHANGELOG.md from the git history
# https://git-cliff.org/docs/configuration
#
# commit types (https://www.conventionalcommits.org):
#
#   feat              -> Added
#   fix               -> Fixed
#   perf, refactor    -> Changed
#   docs              -> Documentation
#   security          -> Security
#   test, ci, chore, style, build -> not in the changelog
#   `!` after the type (e.g. `feat!:`) or `BREAKING CHANGE:` -> **BREAKING**
#
# install: cargo install git-cliff --locked
#
#   git cliff -o CHANGELOG.md                # regenerate the file
#   git cliff --unreleased                   # preview of the unreleased changes
#   git cliff --bump -o CHANGELOG.md         # release, next version from the commits
#   git cliff --tag v0.1.0 -o CHANGELOG.md   # release with a given version
#
# then commit CHANGELOG.md, tag the commit (`git tag v0.1.0`) and push the tag.
#
# the repository URL is written in the footer, with a `[remote.github]`
# section git-cliff would call the GitHub API

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Before 1.0 a minor release (e.g. 0.1 -> 0.2) can have breaking changes.\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif -%}
          {% if commit.scope %}*({{ commit.scope }})* {% endif -%}
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/gnapoli23/quantis-qrng\
                /compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/gnapoli23/quantis-qrng\
                /tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/gnapoli23/quantis-qrng\
            /compare/{{ release.previous.version }}..HEAD
    {% else -%}
        [unreleased]: https://github.com/gnapoli23/quantis-qrng\
            /commits/HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# commits without a type are not dropped, they go under "Other"
filter_unconventional = false
split_commits = false
# subject on two lines (no empty line after the first) -> joined in one line, like git does
commit_preprocessors = [
    { pattern = '^([^\n]+)\n([^\n]+)', replace = "${1} ${2}" },
]
# `<!-- N -->` is only for the order of the sections, the template removes it
commit_parsers = [
    # first commits, before using conventional commits
    { sha = "6939d04a4bd67ed1274c3c7dbc914c15d912a34d", skip = true },
    { sha = "6b3ab36e1206ea76c8680dbf2309da4b4af04e01", skip = true },
    { sha = "1b7e644cef762b2441fe201e22121b7918e06645", skip = true },
    { sha = "be0b707b7b86864f065a388761d3f31e25a8424e", skip = true },

    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
    { message = "^deprecate", group = "<!-- 2 -->Deprecated" },
    { message = "^revert", group = "<!-- 3 -->Removed" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^security", group = "<!-- 5 -->Security" },
    { body = ".*security", group = "<!-- 5 -->Security" },
    { message = "^docs?", group = "<!-- 6 -->Documentation" },
    { message = "^(test|ci|chore|style|build)", skip = true },
    { message = ".*", group = "<!-- 7 -->Other" },
]
# breaking commits are always listed
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
